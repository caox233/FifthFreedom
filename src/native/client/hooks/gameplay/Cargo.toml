cargo-features = ["per-package-target"]

[package]
name = "scbl-gameplay"
version = "0.1.0"
edition = "2021"
forced-target = "i686-pc-windows-msvc"

[lib]
name = "scbl_gameplay"
crate-type = ["cdylib"]

[features]
# Private, bounded F8 diagnostics; never enabled in a normal build.
scis-runtime-diagnostics = []
# Private manual event only; no key hooks and no automatic capture.
vss-emf-witness = []
default = ["extended-player-capacity"]
# Eight total participants, including the photographer. Native allocation stays four per team.
extended-player-capacity = []
# Private OB adapters. Launch remains gated until complete character isolation.
observer-native = []
# Optional bounded F7 inspection shares the adapter build; no public activation.
observer-camera-probe = ["observer-native"]
# Explicit developer build only. Release gameplay has no external rule dependency.
dev-hot-reload = []
# Read-only native lifecycle sampling; does not enable external rule loading.
native-observation = []
# Narrow opt-in gameplay candidate; no observation sampler or extended battery.
goggle-feedback = []
# Private capture only: 10x the MOD endurance; never enable in distributed builds.
drone-capture-long-battery = ["native-observation"]

[dependencies]
server_api = { path = "../../../shared/api", package = "api" }
hooks-addresses = { path = "../hooks-addresses" }
hooks-plugin-api = { path = "../plugin-api" }
region = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(target_os = "windows")'.dependencies]
retour = { version = "0.4.0-alpha.4", features = [
  "thiscall-abi",
  "static-detour",
] }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.54.0"
features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
]

# Native-memory fixtures need this feature even when invoked from the workspace root.
[target.'cfg(target_os = "windows")'.dev-dependencies.windows]
version = "0.54.0"
features = ["Win32_System_Memory"]
