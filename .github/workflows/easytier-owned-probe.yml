name: Owned EasyTier Linux development probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fifth-easytier-owned-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owned-overlay-development:
    name: Fresh reviewed build and isolated transport probes (no runtime publication)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      SODIUM_USE_PKG_CONFIG: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: python
        with:
          python-version: '3.12'
      - name: Install signed compiler and namespace tools without loading drivers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config cmake libsodium-dev libssl-dev libsqlite3-dev clang libclang-dev iproute2 nftables
      - name: Install pinned profile key-validation provider
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r scripts/requirements-profile.txt
      - name: Install both explicit reviewed Rust toolchains
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target x86_64-unknown-linux-gnu
          rustup toolchain install nightly-2025-10-15 --profile minimal
      - name: Install checksum-pinned protoc
        run: python -B scripts/ci_setup_protoc.py --destination "${{ runner.temp }}/protoc-35.1" --github-env
      - name: Require probe input and cleanup regressions
        run: python -B -m unittest discover -s tests/ci -p test_ci_easytier_probe.py -v
      - name: Prepare the same-job six-patch source and verify finite contracts and GNU build
        run: python -B scripts/ci_easytier_build.py
      - name: Compile the exact native socket-policy probe from this checkout
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fifth-native-socket-probe
        run: cargo +nightly-2025-10-15 build --locked --manifest-path src/native/Cargo.toml -p quazal --example socket_policy_probe
      - name: Exercise owned QUIC WSS and development TCP in isolated namespaces
        env:
          PROBE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          mkdir -p artifacts/ci/easytier-probe
          socket_probe="$RUNNER_TEMP/fifth-native-socket-probe/debug/examples/socket_policy_probe"
          socket_probe_sha256="$(sha256sum "$socket_probe" | cut -d ' ' -f1)"
          probe_status=0
          sudo --non-interactive --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_SHA -- "$PROBE_PYTHON" -B scripts/ci_easytier_probe.py \
            --build-receipt "$PWD/artifacts/ci/easytier-build-only/receipt.json" \
            --core "$RUNNER_TEMP/fifth-easytier-build-only/target/x86_64-unknown-linux-gnu/release/easytier-core" \
            --cli "$RUNNER_TEMP/fifth-easytier-build-only/target/x86_64-unknown-linux-gnu/release/easytier-cli" \
            --socket-probe "$socket_probe" --socket-probe-sha256 "$socket_probe_sha256" \
            --output "$PWD/artifacts/ci/easytier-probe/receipt.json" \
            > "$RUNNER_TEMP/easytier-probe.stdout" 2> "$RUNNER_TEMP/easytier-probe.stderr" || probe_status=$?
          python -B scripts/ci_probe_result.py --kind easytier --exit-code "$probe_status" \
            --receipt artifacts/ci/easytier-probe/receipt.json --error-log "$RUNNER_TEMP/easytier-probe.stderr"
      - name: Preserve only the sanitized owned-probe receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owned-easytier-development-receipt-${{ github.sha }}
          path: artifacts/ci/easytier-probe/receipt.json
          if-no-files-found: warn
          retention-days: 14
