name: Paired EasyTier Windows source build only

on:
  pull_request:
    paths:
      - '.github/workflows/easytier-windows-build-only.yml'
      - 'docs/dependency-patches/easytier-2.6.4-explicit-pin/explicit-pin-contract-tests.patch'
      - 'docs/dependency-patches/easytier-2.6.4-explicit-pin/require-explicit-peer-pin.patch'
      - 'docs/dependency-patches/easytier-2.6.4-ingress-data/ingress-contract-tests.patch'
      - 'docs/dependency-patches/easytier-2.6.4-ingress-data/require-encrypted-data-ingress.patch'
      - 'docs/dependency-patches/easytier-2.6.4-secure-session/contract-tests.patch'
      - 'docs/dependency-patches/easytier-2.6.4-secure-session/require-encrypted-flag.patch'
      - 'docs/dependency-patches/easytier-2.6.4-windows-no-packet/no-packet.patch'
      - 'docs/dependency-patches/easytier-2.6.4-windows-no-packet/source/windows_interfaces.rs'
      - 'docs/dependency-patches/easytier-2.6.4-windows-owned-read/owned-read.patch'
      - 'docs/dependency-patches/easytier-2.6.4-windows-owned-read/receipt.json'
      - 'docs/dependency-patches/easytier-2.6.4-windows-owned-read/source/owned_read.rs'
      - 'docs/dependency-patches/easytier-2.6.4-windows-owned-read/source/owned_read_windows.rs'
      - 'docs/dependency-patches/easytier-2.6.4-windows-session-read/receipt.json'
      - 'docs/dependency-patches/easytier-2.6.4-windows-session-read/session-read.patch'
      - 'docs/dependency-patches/easytier-2.6.4-windows-session-read/source/windows_session_read.rs'
      - 'docs/dependency-patches/easytier-2.6.4-windows-session/easytier-session-observer.patch'
      - 'docs/dependency-patches/easytier-2.6.4-windows-session/modern-windows-build.patch'
      - 'docs/dependency-patches/easytier-2.6.4-windows-session/receipt.json'
      - 'docs/dependency-patches/easytier-2.6.4-windows-session/tun-session-observer.patch'
      - 'scripts/ci_easytier_build.py'
      - 'scripts/ci_easytier_windows_build.py'
      - 'scripts/ci_easytier_windows_no_packet.py'
      - 'scripts/ci_easytier_windows_owned_read.py'
      - 'scripts/ci_prepare_easytier_source.py'
      - 'scripts/ci_setup_protoc.py'
      - 'scripts/easytier-source.lock.json'
      - 'scripts/easytier-windows-no-packet.lock.json'
      - 'scripts/easytier-windows-owned-read.lock.json'
      - 'scripts/easytier-windows-source.lock.json'
      - 'scripts/pe_imports.py'
      - 'tests/ci/test_ci_easytier_windows_build.py'
      - 'tests/ci/test_ci_easytier_windows_no_packet.py'
      - 'tests/ci/test_ci_easytier_windows_owned_read.py'
      - 'tests/ci/test_ci_prepare_easytier_source.py'
      - 'tests/ci/test_pe_imports.py'
      - 'tests/native/windows-no-packet/**'
      - 'tests/native/windows-owned-read/**'
      - 'tests/native/windows-session-read/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fifth-easytier-windows-build-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-windows-source:
    name: Paired session backend and full core/CLI (no runtime execution)
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reviewed Rust and explicit Windows target
        run: rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Install checksum-pinned protoc
        run: python -B scripts/ci_setup_protoc.py --destination "${{ runner.temp }}/protoc-35.1" --github-env
      - name: Require hosted MSVC SDK and LLVM for native dependency compilation
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'WINDOWS_MSVC_TOOLCHAIN_REQUIRED' }
          $clang = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$clang\libclang.dll")) { throw 'WINDOWS_LIBCLANG_REQUIRED' }
          "LIBCLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify source pairing, locked resolution and bounded receipt regressions
        run: python -B -m unittest discover -s tests/ci -p test_ci_easytier_windows_build.py -v
      - name: Run bounded typed-read contracts then compile paired backend and core/CLI without running them
        run: python -B scripts/ci_easytier_windows_build.py
      - name: Preserve bounded source/build receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: easytier-windows-build-only-receipts-${{ github.sha }}
          path: |
            artifacts/ci/easytier-windows-build-run.json
            artifacts/ci/easytier-windows-build/source-receipt.json
            artifacts/ci/easytier-windows-build/receipt.json
          if-no-files-found: error
          retention-days: 14

  independent-windows-no-packet:
    name: Independent core/CLI without Packet imports (no runtime execution)
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reviewed Rust and explicit Windows target
        run: rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Install checksum-pinned protoc
        run: python -B scripts/ci_setup_protoc.py --destination "${{ runner.temp }}/protoc-35.1" --github-env
      - name: Require hosted MSVC SDK and LLVM for native dependency compilation
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'WINDOWS_MSVC_TOOLCHAIN_REQUIRED' }
          $clang = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$clang\libclang.dll")) { throw 'WINDOWS_LIBCLANG_REQUIRED' }
          "LIBCLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify source pairing, locked resolution and bounded receipt regressions
        run: python -B -m unittest discover -s tests/ci -p test_ci_easytier_windows_no_packet.py -v
      - name: Run interface and typed-read contracts; compile and statically reject Packet imports
        run: python -B scripts/ci_easytier_windows_no_packet.py
      - name: Preserve bounded source/build receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: easytier-windows-no-packet-receipts-${{ github.sha }}
          path: |
            artifacts/ci/easytier-windows-no-packet-run.json
            artifacts/ci/easytier-windows-no-packet/source-receipt.json
            artifacts/ci/easytier-windows-no-packet/receipt.json
          if-no-files-found: error
          retention-days: 14

  independent-windows-owned-read:
    name: Combined Instance owner-read core/CLI without Packet (no runtime execution)
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reviewed Rust and explicit Windows target
        run: rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Install checksum-pinned protoc
        run: python -B scripts/ci_setup_protoc.py --destination "${{ runner.temp }}/protoc-35.1" --github-env
      - name: Require hosted MSVC SDK and LLVM for native dependency compilation
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'WINDOWS_MSVC_TOOLCHAIN_REQUIRED' }
          $clang = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$clang\libclang.dll")) { throw 'WINDOWS_LIBCLANG_REQUIRED' }
          "LIBCLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify source pairing, locked resolution and bounded receipt regressions
        run: python -B -m unittest discover -s tests/ci -p test_ci_easytier_windows_owned_read.py -v
      - name: Run owner-read, interface and typed contracts; compile actual Instance hook without running core
        run: python -B scripts/ci_easytier_windows_owned_read.py
      - name: Preserve bounded source/build receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: easytier-windows-owned-read-receipts-${{ github.sha }}
          path: |
            artifacts/ci/easytier-windows-owned-read-run.json
            artifacts/ci/easytier-windows-owned-read/source-receipt.json
            artifacts/ci/easytier-windows-owned-read/receipt.json
          if-no-files-found: error
          retention-days: 14
