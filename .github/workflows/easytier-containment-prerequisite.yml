name: Linux strict containment prerequisite

on:
  pull_request:
    paths:
      - '.github/workflows/easytier-containment-prerequisite.yml'
      - 'scripts/ci_easytier_probe.py'
      - 'scripts/ci_probe_result.py'
      - 'scripts/ci_socket_isolation.py'
      - 'tests/ci/test_ci_easytier_probe.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fifth-linux-containment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containment-prerequisite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: python
        with:
          python-version: '3.12'
      - name: Install only signed namespace tools for the strict no-runtime preflight
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends iproute2 nftables
      - name: Install the exact synthetic profile key provider
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r scripts/requirements-profile.txt
      - name: Check exact containment readback and owned namespace cleanup
        env:
          PROBE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          mkdir -p artifacts/ci/easytier-containment
          probe_status=0
          sudo --non-interactive --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_SHA -- "$PROBE_PYTHON" -B scripts/ci_easytier_probe.py \
            --containment-only --output "$PWD/artifacts/ci/easytier-containment/receipt.json" \
            > "$RUNNER_TEMP/easytier-containment.stdout" 2> "$RUNNER_TEMP/easytier-containment.stderr" || probe_status=$?
          python -B scripts/ci_probe_result.py --kind containment --exit-code "$probe_status" \
            --receipt artifacts/ci/easytier-containment/receipt.json --error-log "$RUNNER_TEMP/easytier-containment.stderr"
      - name: Preserve only the sanitized no-runtime containment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-containment-prerequisite-${{ github.sha }}
          path: artifacts/ci/easytier-containment/receipt.json
          if-no-files-found: warn
          retention-days: 14
