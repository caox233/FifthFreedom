name: Windows managed launch prerequisites

on:
  pull_request:
    paths:
      - 'scripts/ci_owned_dependencies.py'
      - 'tests/ci/test_ci_owned_dependencies.py'
      - 'tests/OwnedCoreDependencies/**'
      - 'src/launcher/src/Services/OwnedCoreDependencyInputs.cs'
      - 'docs/tasks/wintun-official-binary-evidence.json'
      - 'scripts/ci_owned_read.py'
      - 'scripts/ci_diagnostics.py'
      - 'global.json'
      - 'tests/ci/test_ci_owned_read.py'
      - 'tests/OwnedCoreRead/**'
      - 'tests/native/windows-owned-read/**'
      - 'src/launcher/src/Services/OwnedCoreRead*.cs'
      - 'docs/dependency-patches/easytier-2.6.4-windows-owned-read/**'
      - '.github/workflows/windows-loopback-prerequisite.yml'
      - 'scripts/ci_windows_loopback.*'
      - 'scripts/ci_windows_iis.ps1'
      - 'tests/FinalLaunchPreparation/**'
      - 'tests/PublicNativeReturn/**'
      - 'tests/PublicSessionControl/Fixtures.cs'
      - 'tests/DiagnosticTextStreaming/**'
      - 'src/launcher/src/Services/DiagnosticTextStream.cs'
      - 'src/launcher/src/Services/DiagnosticTextSanitizer.cs'
      - 'tests/OwnedCoreProcess/**'
      - 'src/launcher/src/Services/OwnedCoreProcess.cs'
      - 'src/launcher/src/Services/OwnedCoreLaunchInputs.cs'
      - 'src/launcher/src/Services/PublicReturnProcess.cs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fifth-windows-loopback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-core-dependencies:
    name: Official DLL file lifetime with x86 synthetic children (DLL never loaded)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Publish the fixed dependency test apphost and x86 runtime into a new directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/ff-owned-dependency-tests" -ErrorAction Stop | Out-Null
          dotnet publish tests/OwnedCoreDependencies/OwnedCoreDependencies.csproj -c Release --runtime win-x86 --self-contained true --output "$env:RUNNER_TEMP/ff-owned-dependency-tests" --nologo
      - name: Require 13 file-lifetime checks with exact official bytes and no skips
        run: python -B scripts/ci_owned_dependencies.py --report "${{ runner.temp }}/owned-core-dependencies.json"
      - name: Preserve only the sanitized dependency file-lifetime receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-owned-core-dependencies-${{ github.sha }}
          path: ${{ runner.temp }}/owned-core-dependencies.json
          if-no-files-found: error
          retention-days: 14

  owned-core-read:
    name: Owned x86 read channel and same-invocation Rust helper (no runtime admission)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the reviewed Rust toolchain for the finite native helper
        run: rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Publish only the fixed owned-read test apphost with its x86 runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/ff-owned-read-tests" -ErrorAction Stop | Out-Null
          dotnet publish tests/OwnedCoreRead/OwnedCoreRead.csproj -c Release --runtime win-x86 --self-contained true --output "$env:RUNNER_TEMP/ff-owned-read-tests" --nologo
      - name: Require native 8, x86 managed 22 and cross-language 4 with no skips
        run: python -B scripts/ci_owned_read.py --report "${{ runner.temp }}/owned-core-read.json"
      - name: Preserve only the sanitized owned-read contract receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-owned-core-read-${{ github.sha }}
          path: ${{ runner.temp }}/owned-core-read.json
          if-no-files-found: error
          retention-days: 14

  owned-core-process:
    name: Actual x86 owned process contracts with synthetic children only
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Publish only the fixed owned-process test apphost with its x86 runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/ff-owned-core-tests" -ErrorAction Stop | Out-Null
          dotnet publish tests/OwnedCoreProcess/OwnedCoreProcess.csproj -c Release --runtime win-x86 --self-contained true --output "$env:RUNNER_TEMP/ff-owned-core-tests" --nologo
      - name: Require actual 17 x86 process and job-object cases with no skips
        run: python -B scripts/ci_windows_loopback.py --suite OwnedCoreProcess --report "${{ runner.temp }}/owned-core-process.json"
      - name: Preserve only the sanitized process-contract receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-owned-core-process-${{ github.sha }}
          path: ${{ runner.temp }}/owned-core-process.json
          if-no-files-found: error
          retention-days: 14
  diagnostic-stream:
    name: Linked diagnostic stream boundaries without game or full ZIP export
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require all 12 linked-production streaming cases and exact summary
        run: python -B scripts/ci_windows_loopback.py --suite DiagnosticTextStreaming --report "${{ runner.temp }}/diagnostic-stream.json"
      - name: Preserve only the sanitized streaming receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-diagnostic-stream-${{ github.sha }}
          path: ${{ runner.temp }}/diagnostic-stream.json
          if-no-files-found: error
          retention-days: 14
  loopback-prerequisite:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read fixed port observations and bind only a fresh owned socket
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/ff-loopback" -ErrorAction Stop | Out-Null
          & ./scripts/ci_windows_loopback.ps1 -Report "$env:RUNNER_TEMP/ff-loopback/prerequisite.json"
      - name: Prepare only the exact default IIS site if it occupies the fixed port
        id: iis_prepare
        shell: pwsh
        run: |
          & ./scripts/ci_windows_iis.ps1 -Mode Prepare -State "$env:RUNNER_TEMP/ff-loopback/iis-restore-plan.json" -Report "$env:RUNNER_TEMP/ff-loopback/iis-prepare.json"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run the unchanged real FinalLaunchPreparation on this same runner
        run: python -B scripts/ci_windows_loopback.py --report "${{ runner.temp }}/ff-loopback/suite.json"
      - name: Require all 27 real managed return and owned configuration-pipe checks
        run: python -B scripts/ci_windows_loopback.py --suite PublicNativeReturn --report "${{ runner.temp }}/ff-loopback/return-suite.json"
      - name: Restore the recorded default IIS site state
        if: ${{ always() && (steps.iis_prepare.outcome == 'success' || steps.iis_prepare.outcome == 'failure' || steps.iis_prepare.outcome == 'cancelled') }}
        shell: pwsh
        run: |
          & ./scripts/ci_windows_iis.ps1 -Mode Restore -State "$env:RUNNER_TEMP/ff-loopback/iis-restore-plan.json" -Report "$env:RUNNER_TEMP/ff-loopback/iis-restore.json"
      - name: Preserve only sanitized observations and suite result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-loopback-prerequisite-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ff-loopback/prerequisite.json
            ${{ runner.temp }}/ff-loopback/suite.json
            ${{ runner.temp }}/ff-loopback/return-suite.json
            ${{ runner.temp }}/ff-loopback/iis-prepare.json
            ${{ runner.temp }}/ff-loopback/iis-restore.json
          if-no-files-found: warn
          retention-days: 14
