name: Fifth Freedom development candidates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fifth-freedom-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-inputs:
    name: Strict complete-package input gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify all pinned package inputs without substituting private saves
        run: python -B scripts/ci_checks.py package-inputs
      - name: Preserve gate receipt even when blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complete-package-input-gate-${{ github.sha }}
          path: |
            artifacts/ci/package-inputs-receipt.json
            artifacts/ci/test-logs/
          if-no-files-found: error
          retention-days: 14

  windows-components:
    name: Windows WPF, x86 hooks, gameplay and LAN components
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned profile key-validation provider
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r scripts/requirements-profile.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Install the pinned Rust toolchain and x86 target
        run: rustup toolchain install nightly-2025-10-15 --profile minimal --target i686-pc-windows-msvc
      - name: Install checksum-pinned protoc
        run: python -B scripts/ci_setup_protoc.py --destination "${{ runner.temp }}/protoc-35.1" --github-env
      - name: Source, UI routing, server contracts and CI tests
        run: python -B scripts/ci_checks.py source
      - name: Compile, test and run isolated no-game UI checks without claiming complete-package admission
        run: python -B scripts/ci_candidate.py windows-components
      - name: Preserve compile-only components, checksums and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-compile-only-components-${{ github.sha }}
          path: |
            artifacts/ci/windows-components/
            artifacts/ci/source-receipt.json
            artifacts/ci/test-logs/
            artifacts/logs/
          if-no-files-found: error
          retention-days: 14

  linux-lan-baseline:
    name: Linux linux-lan-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      SODIUM_USE_PKG_CONFIG: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install signed Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config cmake libsodium-dev libssl-dev libsqlite3-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2025-10-15 --profile minimal
      - name: Install checksum-pinned protoc
        run: python -B scripts/ci_setup_protoc.py --destination "${{ runner.temp }}/protoc-35.1" --github-env
      - name: Build and test the explicitly selected server source
        run: python -B scripts/ci_candidate.py linux-lan-baseline
      - name: Preserve reference components and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-lan-baseline-${{ github.sha }}
          path: |
            artifacts/ci/linux-lan-baseline/
            artifacts/logs/
          if-no-files-found: error
          retention-days: 14

  linux-public-donor-reference:
    name: Linux linux-public-donor-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      SODIUM_USE_PKG_CONFIG: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install signed Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config cmake libsodium-dev libssl-dev libsqlite3-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2025-10-15 --profile minimal
      - name: Install checksum-pinned protoc
        run: python -B scripts/ci_setup_protoc.py --destination "${{ runner.temp }}/protoc-35.1" --github-env
      - name: Build and test the explicitly selected server source
        run: python -B scripts/ci_candidate.py linux-public-donor-reference
      - name: Preserve reference components and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-public-donor-reference-${{ github.sha }}
          path: |
            artifacts/ci/linux-public-donor-reference/
            artifacts/logs/
          if-no-files-found: error
          retention-days: 14

  linux-public-control:
    name: Linux protected public control service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned profile key-validation provider
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r scripts/requirements-profile.txt
      - name: Test retained authentication and protected loopback TLS lifecycle
        run: python -B scripts/ci_candidate.py linux-public-control
      - name: Preserve isolated control-service candidate and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-public-control-${{ github.sha }}
          path: |
            artifacts/ci/linux-public-control/
            artifacts/ci/test-logs/
            artifacts/logs/
          if-no-files-found: error
          retention-days: 14

  linux-public-server-integrity:
    name: Linux service/client identities and static deployment preflight
    needs: [windows-components, linux-lan-baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download this workflow's exact Windows component artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-compile-only-components-${{ github.sha }}
          path: ${{ runner.temp }}/public-server-inputs/windows
      - name: Download this workflow's exact retained Linux component artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-lan-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/public-server-inputs/linux
      - name: Install signed runtime libraries for the system-linked Linux executable
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsodium23 libsqlite3-0 libssl3t64
      - name: Verify same-run identities and require read-only deployment preflight
        run: python -B scripts/ci_candidate.py linux-public-server-integrity
      - name: Preserve component-only identity evidence without releasing or deploying
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-public-server-component-candidate-${{ github.sha }}
          path: |
            artifacts/ci/linux-public-server-integrity/
            artifacts/logs/
          if-no-files-found: warn
          retention-days: 14

  linux-native-owned-lifecycle:
    name: Same-run native owned lifecycle in synthetic namespaces
    needs: linux-public-server-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: python
        with:
          python-version: '3.12'
      - name: Download only this workflow's exact verified component candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-public-server-component-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/native-lifecycle-input
      - name: Install signed native runtime and owned namespace tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsodium23 libsqlite3-0 libssl3t64 iproute2
      - name: Require withheld denied EOF expiry and parent-death contracts
        env:
          PROBE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-lifecycle"
          package="$RUNNER_TEMP/native-lifecycle-input/ci/linux-public-server-integrity/candidate"
          probe_status=0
          sudo --non-interactive -- "$PROBE_PYTHON" -B -I -S scripts/ci_native_lifecycle.py \
            --package "$package" --candidate-receipt "$package/CANDIDATE-RECEIPT.json" \
            --runner-temp /tmp --report "$RUNNER_TEMP/native-lifecycle/receipt.json" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/native-lifecycle.stdout" 2> "$RUNNER_TEMP/native-lifecycle.stderr" || probe_status=$?
          python -B scripts/ci_probe_result.py --kind native --exit-code "$probe_status" \
            --receipt "$RUNNER_TEMP/native-lifecycle/receipt.json" --error-log "$RUNNER_TEMP/native-lifecycle.stderr"
      - name: Preserve only the sanitized native lifecycle receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-owned-lifecycle-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/native-lifecycle/receipt.json
          if-no-files-found: warn
          retention-days: 14

  linux-socket-isolation:
    name: Linux native socket ingress isolation (synthetic namespaces)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      SODIUM_USE_PKG_CONFIG: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install signed native build and owned namespace test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config cmake libsodium-dev libssl-dev libsqlite3-dev iproute2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2025-10-15 --profile minimal
      - name: Install checksum-pinned protoc
        run: python -B scripts/ci_setup_protoc.py --destination "${{ runner.temp }}/protoc-35.1" --github-env
      - name: Require controls, ingress isolation and owned namespace cleanup
        run: python -B scripts/ci_candidate.py linux-socket-isolation
      - name: Preserve synthetic isolation evidence without enabling Public startup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-native-socket-isolation-${{ github.sha }}
          path: |
            artifacts/ci/linux-socket-isolation/
            artifacts/ci/test-logs/
            artifacts/logs/
          if-no-files-found: warn
          retention-days: 14

  windows-complete-package:
    name: Complete Windows candidate (requires admitted inputs)
    needs: package-inputs
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: rustup toolchain install nightly-2025-10-15 --profile minimal --target i686-pc-windows-msvc
      - run: python -B scripts/ci_setup_protoc.py --destination "${{ runner.temp }}/protoc-35.1" --github-env
      - name: Run the unchanged full build, regression and package-verification entry
        run: python -B scripts/build.py all
      - name: Verify isolated packaged UI and bundled-save checks without starting a game
        run: python -B scripts/ci_candidate.py windows-package-smoke
      - name: Preserve candidate package or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-complete-candidate-${{ github.sha }}
          path: |
            artifacts/*-program.zip
            artifacts/BUILD-RESULT.json
            artifacts/ci/windows-package-smoke/
            artifacts/logs/
            artifacts/program/**/package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
