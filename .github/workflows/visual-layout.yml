name: Fifth Freedom WPF visual layout

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fifth-freedom-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-wpf-layout:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Actual WPF baseline, modified, rollback and reapplied captures
        run: python -B scripts/ci_visual_probe.py
      - name: Preserve actual screenshots, layout checks and source-bound hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actual-wpf-layout-${{ github.sha }}
          path: artifacts/visual-probe/
          if-no-files-found: error
          retention-days: 30
