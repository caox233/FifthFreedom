name: Fifth Freedom source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned profile key-validation provider
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r scripts/requirements-profile.txt
      - run: python -B scripts/check_migration.py --require-fifth-freedom
      - run: python -B scripts/ci_checks.py source
      - name: Preserve source-check scope and counts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-source-evidence-${{ github.sha }}
          path: |
            artifacts/ci/source-receipt.json
            artifacts/ci/test-logs/
          if-no-files-found: error
          retention-days: 14
